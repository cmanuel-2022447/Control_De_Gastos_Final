<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="brand-lockup">
        <div class="logo-frame">
          <img src="assets/logo.png" alt="Logo de la empresa" />
        </div>
        <span class="brand-kicker">Tu dinero, con intención</span>
      </div>
      <h1>Control de<br /><em>Gastos</em></h1>
      <div class="login-subtitle">Una vista más clara de cada decisión.</div>
    </div>

    <div class="form-panel">
      <h2>Iniciar sesión</h2>
      <div *ngIf="success" class="success-message" role="status" aria-live="polite">{{ success }}</div>
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="login">Correo o usuario</label>
          <input 
            type="text" 
            appStrictInput="login"
            id="login" 
            [(ngModel)]="loginValue" 
            name="login" 
            placeholder="correo@ejemplo.com o usuario"
            pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|[A-Za-z0-9._-]+"
            maxlength="255"
            required
          />
        </div>

        <div class="form-group password-group">
          <label for="password">Contraseña</label>
          <input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="********"
            required
          />
          <button type="button" class="password-toggle" (click)="alternarPassword()" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>

        <button type="submit" class="btn-login" [disabled]="cargando">
          <span>{{ cargando ? 'Comprobando acceso...' : 'Iniciar Sesión' }}</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </button>
      </form>

      <div *ngIf="googleEnabled" class="google-option">
        <span class="google-divider" aria-hidden="true">o</span>
        <div #googleButton class="google-button" aria-label="Iniciar sesión con Google"></div>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>
      <p class="register-prompt">
        ¿Aún no tienes cuenta? <a class="account-link" routerLink="/register">Regístrate</a>
      </p>
    </div>

  </div>
</div>
