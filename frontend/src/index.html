<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Estilos globales para eliminar márgenes blancos y fijar el fondo -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: #0b2545;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    app-root {
      display: block;
      min-height: 100vh;
      background: #0b2545;
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
